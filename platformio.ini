[env:jc3248w535]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Force the compiler to recognize the full 16MB Flash and 8MB OPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Installs the correct display library to handle the screen's AXS15231B chip
; Touch (AXS15231 @ 0x3B) is driven directly over I2C in src/touch.cpp, so no
; touch library is needed (bb_captouch's AXS15231 auto-detect is disabled).
lib_deps =
    moononournation/GFX Library for Arduino @ ^1.4.9
    h2zero/NimBLE-Arduino @ ^2.1.0

; Host-side unit tests for the pure logic in include/logic/ (no hardware).
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -I include
